tools:
  - name: list_context
    kind: seed
    module: tools.seed_tools.list_context
    function: list_context
    description: List visible files under docs/ and data/.
  - name: read_md
    kind: seed
    module: tools.seed_tools.read_md
    function: read_md
    description: Read visible Markdown files.
  - name: read_csv
    kind: seed
    module: tools.seed_tools.read_csv
    function: read_csv
    description: Read visible CSV files.
  - name: run_solver
    kind: seed
    module: tools.seed_tools.run_solver
    function: run_solver
    description: Run optimization solver code in the guarded runtime.
  - name: execute_python
    kind: seed
    module: tools.seed_tools.execute_python
    function: execute_python
    description: Execute Python code in the guarded runtime.
  - name: finalize
    kind: seed
    module: tools.seed_tools.finalize
    function: finalize
    description: Submit final code and objective value.
  - name: audit_model_text
    kind: evolved
    file: audit_model_text.py
    function: audit_model_text
    description: Inspect draft model notes or code for common formulation risks before finalizing.
  - name: type_router
    kind: evolved
    file: type_router.py
    function: type_router
    description: Route agent-supplied visible evidence to relevant evolved skills, memories, and checklists.
  - name: answer_checker
    kind: evolved
    file: answer_checker.py
    function: answer_checker
    description: Check final code and submitted objective against selected evolved harness checklists before finalize.
